<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escapada Romántica a Asturias - Noviembre 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FDFBF7;
      --card-bg: #FFFFFF;
      --text-main: #2D241E;
      --text-muted: #6B5E55;
      --accent: #C86D51;
      --accent-soft: #F4ECE1;
      --border: #E8DFD5;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(45, 36, 30, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px 16px 60px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 40px 20px 30px;
    }

    .badge {
      display: inline-block;
      background-color: var(--accent-soft);
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem;
      color: var(--text-main);
      line-height: 1.2;
      margin-bottom: 12px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }

    .info-card {
      background: var(--card-bg);
      padding: 18px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .info-card label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .info-card span {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      margin: 36px 0 16px;
      color: var(--text-main);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }

    .photo-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .photo-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }

    .photo-caption {
      padding: 10px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      text-align: center;
    }

    .itinerary {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .day-card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid
